<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="SM SOJIB — Student Digital NFC Profile"
  >

  <meta name="theme-color" content="#080b10">

  <title>SM SOJIB | Digital Profile</title>

  <style>
    /* =========================
       RESET
    ========================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    /* =========================
       BODY
    ========================== */

    body {
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #171c27 0%,
          #080b10 55%,
          #05070a 100%
        );

      color: #ffffff;
      padding: 24px 14px;
    }


    /* =========================
       MAIN WRAPPER
    ========================== */

    .wrap {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
    }


    /* =========================
       PROFILE CARD
    ========================== */

    .card {
      width: 100%;
      padding: 30px 22px 26px;

      background:
        linear-gradient(
          145deg,
          #151b26,
          #0a0e14
        );

      border: 1px solid #b88a2b;
      border-radius: 28px;

      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }


    /* =========================
       PROFILE PHOTO
    ========================== */

    .avatar {
      width: 110px;
      height: 110px;

      margin: 0 auto;

      border-radius: 50%;
      overflow: hidden;

      border: 3px solid #c99b3d;

      background: #11151c;

      box-shadow:
        0 0 0 5px rgba(201, 155, 61, 0.08),
        0 10px 30px rgba(0, 0, 0, 0.45);
    }


    .avatar img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;
      object-position: center;
    }


    /* =========================
       NAME
    ========================== */

    h1 {
      margin-top: 17px;

      text-align: center;

      font-size: 30px;
      line-height: 1.2;

      font-weight: 800;

      letter-spacing: 1px;
    }


    /* =========================
       ROLE
    ========================== */

    .role {
      margin-top: 7px;

      text-align: center;

      color: #e4bf68;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 4px;

      text-transform: uppercase;
    }


    /* =========================
       GOLD DIVIDER
    ========================== */

    .line {
      width: 100%;
      height: 1px;

      margin: 25px 0 22px;

      background:
        linear-gradient(
          90deg,
          transparent,
          #c99835,
          transparent
        );
    }


    /* =========================
       BUTTONS
    ========================== */

    .btn {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 14px;

      padding: 14px 15px;
      margin: 11px 0;

      color: #ffffff;
      text-decoration: none;

      background: #10151d;

      border: 1px solid #30281b;
      border-radius: 16px;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }


    .btn:hover {
      transform: translateY(-2px);

      border-color: #c99b3d;

      background: #141a23;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.3);
    }


    .btn:active {
      transform: scale(0.98);
    }


    /* =========================
       ICON
    ========================== */

    .ico {
      width: 40px;
      height: 40px;

      flex: 0 0 40px;

      display: grid;
      place-items: center;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #e2b957,
          #a97620
        );

      color: #111111;

      font-size: 18px;
      font-weight: 800;
    }


    /* =========================
       BUTTON TEXT
    ========================== */

    .info {
      min-width: 0;
      line-height: 1.25;
    }


    .info b {
      font-size: 15px;
      font-weight: 700;
    }


    .small {
      display: inline-block;

      margin-top: 3px;

      color: #aeb4bf;

      font-size: 12px;

      word-break: break-word;
    }


    /* =========================
       ADDRESS
    ========================== */

    .address {
      margin-top: 22px;

      text-align: center;

      color: #c7ccd5;

      font-size: 14px;
      line-height: 1.6;
    }


    /* =========================
       QR CODE
    ========================== */

    .qr {
      margin: 27px auto 8px;

      text-align: center;
    }


    .qr img {
      width: 190px;
      max-width: 80%;

      display: block;

      margin: 0 auto;

      padding: 9px;

      background: #ffffff;

      border-radius: 16px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.35);
    }


    .qr p {
      margin-top: 12px;

      color: #e4bf68;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: 2px;
    }


    /* =========================
       FOOTER
    ========================== */

    .footer {
      margin-top: 22px;

      text-align: center;

      color: #777f8c;

      font-size: 11px;

      letter-spacing: 0.3px;
    }


    /* =========================
       MOBILE
    ========================== */

    @media (max-width: 480px) {

      body {
        padding: 14px 10px;
      }

      .card {
        padding: 27px 17px 23px;

        border-radius: 24px;
      }

      .avatar {
        width: 100px;
        height: 100px;
      }

      h1 {
        font-size: 27px;
      }

      .role {
        font-size: 11px;
        letter-spacing: 3px;
      }

      .btn {
        padding: 13px 13px;
      }

      .ico {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
      }

      .address {
        font-size: 13px;
      }
    }


    /* =========================
       VERY SMALL PHONES
    ========================== */

    @media (max-width: 350px) {

      .card {
        padding-left: 14px;
        padding-right: 14px;
      }

      h1 {
        font-size: 24px;
      }

      .btn {
        gap: 10px;
      }

      .small {
        font-size: 11px;
      }
    }

  </style>
</head>


<body>

  <div class="wrap">

    <main class="card">

      <!-- Profile Photo -->
      <div class="avatar">
        <img

        >
      </div>

      <h1>SM SOJIB</h1>

      <!-- Divider -->

      <a

        </span>

      <!-- Email -->
      <a
        class="btn"

      >
        <span class="ico">@</span>

        <span class="info">
          <b>Email</b><br>

          </span>
        </span>
      </a>


      <!-- Facebook -->
      <a
        class="btn"

        target="_blank"

        aria-label="Facebook SM SOJIB"
      >
        <span class="ico">f</span>

        <span class="info">
          <b>Facebook</b><br>
          <span class="small">
            SM EMON
          </span>
        </span>
      </a>


      <!-- Address -->
      <div class="address">
        📍 KA/28 Mir Swapnochura, Gulshan
      </div>


      <!-- WhatsApp QR -->
      <div class="qr">

        <img
          src="https://quickchart.io/qr?text=https%3A%2F%2Fwa.me%2F8801339882860&size=240&margin=2"
          alt="WhatsApp QR Code"
        >

        <p>
          SCAN TO WHATSAPP
        </p>

      </div>


      <!-- Footer -->
      <div class="footer">
        Digital NFC Profile • SM SOJIB
      </div>

    </main>

  </div>

</body>
</html>
