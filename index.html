<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SM SOJIB | Digital Profile</title>
  <meta
    name="description"
    content="SM SOJIB — Professional Digital NFC Profile"
  >
  <meta name="theme-color" content="#080b10">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #1a1d24 0%, #080b10 45%, #05070a 100%);
      color: #ffffff;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 24px 16px 35px;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 30px 20px 24px;
      border: 1px solid #b88a2b;
      border-radius: 28px;
      background:
        linear-gradient(145deg, #151a23, #090c12);
      box-shadow:
        0 25px 70px rgba(0, 0, 0, 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .card::before {
      content: "";
      position: absolute;
      top: -100px;
      right: -100px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(201, 155, 61, 0.08);
      pointer-events: none;
    }

    .avatar {
      width: 92px;
      height: 92px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      border: 2px solid #e4bf68;

      background:
        linear-gradient(135deg, #f5d27a, #9c6b18);

      color: #111;
      font-size: 30px;
      font-weight: 800;

      box-shadow:
        0 8px 30px rgba(201, 155, 61, 0.25);
    }

    h1 {
      margin-top: 17px;
      text-align: center;
      font-size: 30px;
      letter-spacing: 1.5px;
    }

    .role {
      margin-top: 7px;
      text-align: center;
      color: #e4bf68;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .line {
      width: 100%;
      height: 1px;
      margin: 25px 0;
      background:
        linear-gradient(
          90deg,
          transparent,
          #c99835,
          transparent
        );
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;

      width: 100%;
      margin: 11px 0;
      padding: 14px 15px;

      border: 1px solid #332a1a;
      border-radius: 16px;

      background: #10151d;
      color: #ffffff;
      text-decoration: none;

      transition: 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: #c99b3d;
      background: #151b24;
    }

    .ico {
      flex: 0 0 38px;
      width: 38px;
      height: 38px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 11px;
      background: #c99b3d;

      color: #111;
      font-size: 18px;
      font-weight: 800;
    }

    .info {
      min-width: 0;
    }

    .info b {
      font-size: 15px;
    }

    .small {
      display: inline-block;
      margin-top: 3px;

      color: #aeb4bf;
      font-size: 12px;

      overflow-wrap: anywhere;
    }

    .address {
      margin-top: 23px;
      padding: 0 5px;

      color: #c7ccd5;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .qr {
      margin: 27px auto 8px;
      text-align: center;
    }

    .qr img {
      display: block;
      width: 190px;
      height: 190px;
      margin: 0 auto;

      padding: 9px;
      border-radius: 16px;

      background: #ffffff;
    }

    .qr p {
      margin-top: 12px;

      color: #e4bf68;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .footer {
      margin-top: 22px;

      color: #777f8b;
      text-align: center;
      font-size: 11px;
      letter-spacing: 0.5px;
    }

    @media (max-width: 380px) {
      .page {
        padding: 16px 11px 25px;
      }

      .card {
        padding: 25px 16px 20px;
        border-radius: 24px;
      }

      h1 {
        font-size: 27px;
      }

      .avatar {
        width: 84px;
        height: 84px;
      }

      .qr img {
        width: 175px;
        height: 175px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <main class="card">

      <!-- Profile -->
      <div class="avatar">SM</div>

      <h1>SM SOJIB</h1>

      <div class="role">Student</div>

      <div class="line"></div>


      <!-- Call -->
      <a
        class="btn"
        href="tel:+8801339882860"
        aria-label="Call SM SOJIB"
      >
        <span class="ico">☎</span>

        <span class="info">
          <b>Call</b><br>
          <span class="small">01339882860</span>
        </span>
      </a>


      <!-- WhatsApp -->
      <a
        class="btn"
        href="https://wa.me/8801339882860"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="WhatsApp SM SOJIB"
      >
        <span class="ico">W</span>

        <span class="info">
          <b>WhatsApp</b><br>
          <span class="small">Chat with me</span>
        </span>
      </a>


      <!-- Email -->
      <a
        class="btn"
        href="mailto:mdsmemon26@gmail.com"
        aria-label="Email SM SOJIB"
      >
        <span class="ico">@</span>

        <span class="info">
          <b>Email</b><br>
          <span class="small">mdsmemon26@gmail.com</span>
        </span>
      </a>


      <!-- Facebook -->
      <a
        class="btn"
        href="https://www.facebook.com/smemon26"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook SM SOJIB"
      >
        <span class="ico">f</span>

        <span class="info">
          <b>Facebook</b><br>
          <span class="small">SM EMON</span>
        </span>
      </a>


      <!-- Address -->
      <div class="address">
        📍 KA/28 Mir Swapnochura, Gulshan
      </div>


      <!-- QR Code -->
      <div class="qr">

        <img
          src="https://quickchart.io/qr?text=https%3A%2F%2Fwa.me%2F8801339882860&size=240&margin=2"
          alt="WhatsApp QR Code"
        >

        <p>SCAN TO WHATSAPP</p>

      </div>


      <!-- Footer -->
      <div class="footer">
        Digital NFC Profile • SM SOJIB
      </div>

    </main>

  </div>

</body>
</html>
