<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SM SOJIB | Digital Profile</title>

  <meta
    name="description"
    content="SM SOJIB — Student Digital Profile"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #080b10;
      color: #ffffff;
      min-height: 100vh;
    }

    .wrap {
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 25px 16px 35px;
    }

    .card {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(
          circle at top right,
          rgba(212, 166, 58, 0.10),
          transparent 30%
        ),
        linear-gradient(145deg, #121821, #080b10);

      border: 1px solid #b88a2b;
      border-radius: 28px;
      padding: 30px 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    }

    /* Profile Photo */
    .profile-photo {
      width: 160px;
      height: 160px;
      object-fit: cover;
      display: block;
      margin: 0 auto;
      border-radius: 50%;
      border: 3px solid #d4a63a;
      background: #c99b3d;
      box-shadow:
        0 0 25px rgba(212, 166, 58, 0.25);
    }

    h1 {
      text-align: center;
      margin-top: 22px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .role {
      text-align: center;
      margin-top: 8px;
      color: #e4bf68;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .line {
      height: 1px;
      margin: 28px 0;
      background:
        linear-gradient(
          90deg,
          transparent,
          #c99835,
          transparent
        );
    }

    /* Buttons */
    .btn {
      display: flex;
      align-items: center;
      gap: 15px;

      width: 100%;
      min-height: 82px;

      margin: 12px 0;
      padding: 15px 17px;

      text-decoration: none;
      color: #ffffff;

      background: #10151d;
      border: 1px solid #332a1a;
      border-radius: 18px;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      border-color: #c99b3d;
      background: #141a23;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .ico {
      flex: 0 0 56px;

      width: 56px;
      height: 56px;

      display: grid;
      place-items: center;

      border-radius: 15px;

      background: linear-gradient(
        135deg,
        #e2b84f,
        #bd8b25
      );

      color: #111111;
      font-size: 25px;
      font-weight: 800;
    }

    .info {
      min-width: 0;
    }

    .info b {
      display: block;
      font-size: 18px;
      margin-bottom: 4px;
    }

    .small {
      color: #aeb4bf;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
    }

    /* Address */
    .address {
      text-align: center;
      color: #c7ccd5;
      font-size: 15px;
      line-height: 1.6;
      margin: 28px 5px 0;
    }

    /* QR */
    .qr {
      text-align: center;
      margin: 28px auto 8px;
    }

    .qr img {
      width: 210px;
      max-width: 100%;
      height: auto;

      display: block;
      margin: 0 auto;

      padding: 10px;

      background: #ffffff;
      border-radius: 18px;
    }

    .qr p {
      margin-top: 13px;

      color: #e4bf68;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    /* Footer */
    .footer {
      text-align: center;
      color: #777f8b;
      font-size: 11px;
      margin-top: 22px;
    }

    /* Mobile */
    @media (max-width: 480px) {
      .wrap {
        padding: 18px 12px 28px;
      }

      .card {
        padding: 26px 16px;
        border-radius: 24px;
      }

      .profile-photo {
        width: 145px;
        height: 145px;
      }

      h1 {
        font-size: 30px;
      }

      .role {
        font-size: 12px;
        letter-spacing: 4px;
      }

      .btn {
        min-height: 76px;
        padding: 13px 14px;
      }

      .ico {
        flex-basis: 52px;
        width: 52px;
        height: 52px;
      }

      .info b {
        font-size: 17px;
      }

      .small {
        font-size: 13px;
      }

      .qr img {
        width: 200px;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <main class="card">

      <!-- Profile Photo -->
      <img
        src="profile.jpg"
        alt="SM SOJIB"
        class="profile-photo"
      >

      <!-- Name -->
      <h1>SM SOJIB</h1>

      <!-- Role -->
      <div class="role">Student</div>

      <div class="line"></div>


      <!-- Call -->
      <a
        class="btn"
        href="tel:+8801339882860"
        aria-label="Call SM SOJIB"
      >
        <span class="ico">☎</span>

        <span class="info">
          <b>Call</b>
          <span class="small">01339882860</span>
        </span>
      </a>


      <!-- WhatsApp -->
      <a
        class="btn"
        href="https://wa.me/8801339882860"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="WhatsApp SM SOJIB"
      >
        <span class="ico">W</span>

        <span class="info">
          <b>WhatsApp</b>
          <span class="small">Chat with me</span>
        </span>
      </a>


      <!-- Email -->
      <a
        class="btn"
        href="mailto:mdsmemon26@gmail.com"
        aria-label="Email SM SOJIB"
      >
        <span class="ico">@</span>

        <span class="info">
          <b>Email</b>
          <span class="small">mdsmemon26@gmail.com</span>
        </span>
      </a>


      <!-- Facebook -->
      <a
        class="btn"
        href="https://www.facebook.com/smemon26"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Facebook SM SOJIB"
      >
        <span class="ico">f</span>

        <span class="info">
          <b>Facebook</b>
          <span class="small">SM EMON</span>
        </span>
      </a>


      <!-- Address -->
      <div class="address">
        📍 KA/28 Mir Swapnochura, Gulshan
      </div>


      <!-- WhatsApp QR Code -->
      <div class="qr">

        <img
          src="https://quickchart.io/qr?text=https%3A%2F%2Fwa.me%2F8801339882860&size=240&margin=2"
          alt="WhatsApp QR Code"
        >

        <p>SCAN TO WHATSAPP</p>

      </div>


      <!-- Footer -->
      <div class="footer">
        Digital NFC Profile • SM SOJIB
      </div>

    </main>

  </div>

</body>
</html>
